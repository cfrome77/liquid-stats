name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Validate environment scripts
        # Runs the real generate-env.js / ensure-local-env.js / inject-proxy-origin.js
        # against a throwaway tree and asserts they reject missing or malformed
        # variables before writing anything. No browser or dev server needed.
        run: npx playwright test --config playwright.scripts.config.ts
      - name: Build
        run: npm run build:prod
        env:
          # generate-env.js validates these strictly, so the CI build needs
          # well-formed placeholder values rather than an empty environment.
          DATA_URL: https://example-bucket.s3.amazonaws.com/
          UNTAPPD_USERNAME: ci-user
          GA4_MEASUREMENT_ID: G-CI00000
      - name: Unit tests
        run: npm run test:ci
        env:
          CI: true

  lambda:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lambda/requirements*.txt
      - name: Install dependencies
        run: pip install -r lambda/requirements-dev.txt
      - name: Lambda schema validation tests
        run: python -m pytest lambda/tests

  e2e:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx playwright test
        env:
          CI: true
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
