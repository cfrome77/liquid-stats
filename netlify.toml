# netlify.toml - Node 22 + esbuild + redirects

[build]
# The /api-data/ proxy target is derived from DATA_URL so the bucket name lives
# in exactly one place (the environment variable, which is also what the bundle
# reads). Netlify does not expand ${...} in netlify.toml directly, but it does
# substitute values into [[redirects]] when the build command edits the file,
# because redirects are read after the build completes. DATA_URL must be the
# bucket origin with a trailing slash.
command = "if [ -n \"$DATA_URL\" ]; then sed -i \"s|S3_ORIGIN_PLACEHOLDER|$DATA_URL|\" netlify.toml; fi && npm run build:prod"
publish = "dist/liquid-stats/browser"

[build.environment]
NODE_VERSION = "22"

# Functions config (minimal, warning-free)
[functions]
node_bundler = "esbuild"

# Redirect API data to S3. The target is substituted from DATA_URL by the build
# command above; see the comment there for why a placeholder is used.
[[redirects]]
from = "/api-data/*"
to = "S3_ORIGIN_PLACEHOLDER:splat"
status = 200
force = true

# SPA fallback for Angular routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
