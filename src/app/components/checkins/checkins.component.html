<div class="main-content-container">
  <div class="flex-row align-center justify-center" style="margin-bottom: 20px">
    <h1 style="margin: 0">Recent Checkins</h1>
  </div>

  <div
    class="flex-row align-center justify-center gap-4"
    style="margin-bottom: 20px"
  >
    <button
      mat-stroked-button
      class="view-toggle-btn"
      [class.active]="viewMode() === 'cards'"
      (click)="viewMode.set('cards')"
      aria-label="Cards view"
    >
      <mat-icon>view_agenda</mat-icon> Cards
    </button>
    <button
      mat-stroked-button
      class="view-toggle-btn"
      [class.active]="viewMode() === 'compact'"
      (click)="viewMode.set('compact')"
      aria-label="Compact view"
    >
      <mat-icon>view_list</mat-icon> Compact
    </button>
  </div>

  @if (isLoadingAll && paginatedCheckins.length === 0) {
    <app-skeleton-card [viewMode]="viewMode()" [count]="5"></app-skeleton-card>
  } @else if (hasLoadError()) {
    <app-empty-state
      icon="cloud_off"
      variant="error"
      message="We couldn't load your check-ins. You may be offline or the data service is temporarily unavailable."
      buttonText="Retry"
      (action)="retryLoad()"
    ></app-empty-state>
  } @else {
    <div
      class="cards-layout-container"
      [class.cards-layout]="viewMode() === 'cards'"
      [class.compact-layout]="viewMode() === 'compact'"
    >
      @for (checkin of paginatedCheckins; track checkin.extraData?.checkinId) {
        <div
          [id]="'checkin-' + checkin.extraData?.checkinId"
          class="card-wrapper"
        >
          <app-card
            [cardData]="checkin"
            [viewMode]="viewMode()"
            (badgeClick)="openBadgeDialog($event)"
          >
          </app-card>
        </div>
      } @empty {
        <app-empty-state
          icon="history"
          message="No recent checkins found."
        ></app-empty-state>
      }
    </div>
  }

  @if (totalItems > 0) {
    <app-pagination
      [currentPage]="currentPage"
      [itemsPerPage]="itemsPerPage"
      [totalItems]="totalItems"
      (pageChange)="onPageChange($event)"
      (itemsPerPageChange)="onItemsPerPageChange($event)"
    >
    </app-pagination>
  }
</div>
