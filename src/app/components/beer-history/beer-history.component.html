<div class="main-content-container">
  <h1>Beer History</h1>
  <div class="filter-card glass-panel">
    <div class="filter-card-content">
      <div class="filter-buttons-container">
        <app-filter
          [filterFields]="filterFields"
          (filterChanged)="onFilterChange()"
        ></app-filter>
      </div>

      <div class="filter-row">
        <div class="form-field-wrapper">
          <mat-form-field class="search-field" appearance="outline">
            <input
              matInput
              type="text"
              placeholder="Search beers..."
              [(ngModel)]="searchTerm"
              (input)="onSearchChange()"
            />
            @if (searchTerm) {
              <button
                matSuffix
                mat-icon-button
                aria-label="Clear search"
                (click)="searchTerm = ''; onSearchChange()"
              >
                <mat-icon>close</mat-icon>
              </button>
            }
          </mat-form-field>
        </div>

        <button mat-flat-button color="primary" (click)="resetFilters()">
          Reset Filters
        </button>
      </div>
    </div>
  </div>

  <div
    class="flex-row align-center justify-center gap-4"
    style="margin-bottom: 20px"
  >
    <button
      mat-stroked-button
      class="view-toggle-btn"
      [class.active]="viewMode() === 'grid'"
      (click)="viewMode.set('grid')"
      aria-label="Grid view"
    >
      <mat-icon>grid_view</mat-icon> Grid
    </button>
    <button
      mat-stroked-button
      class="view-toggle-btn"
      [class.active]="viewMode() === 'compact'"
      (click)="viewMode.set('compact')"
      aria-label="Compact list view"
    >
      <mat-icon>view_list</mat-icon> Compact
    </button>
  </div>

  @if (isLoadingAll) {
    <div class="flex-column" style="align-items: stretch; gap: 10px">
      @for (i of [1, 2, 3, 4]; track i) {
        <app-skeleton-card [viewMode]="viewMode()"></app-skeleton-card>
      }
    </div>
  } @else {
    <div class="flex-column" style="align-items: stretch; gap: 10px">
      @for (beerCard of paginatedBeers; track beerCard.title) {
        <app-card [cardData]="beerCard" [viewMode]="viewMode()"></app-card>
      } @empty {
        <app-empty-state
          icon="search_off"
          message="No beers match your search criteria."
          buttonText="Clear Filters"
          (action)="resetFilters()"
        ></app-empty-state>
      }
    </div>

    <app-pagination
      [currentPage]="currentPage"
      [itemsPerPage]="itemsPerPage"
      [totalItems]="totalItems"
      (pageChange)="goToPage($event)"
      (itemsPerPageChange)="changeItemsPerPage($event)"
    >
    </app-pagination>
  }
</div>
