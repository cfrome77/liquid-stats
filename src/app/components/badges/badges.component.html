<div class="main-content-container">
  <h1>Badges Earned</h1>

  <div
    class="flex-row align-center justify-center gap-4"
    style="margin-bottom: 20px"
  >
    <button
      mat-stroked-button
      class="view-toggle-btn"
      [class.active]="viewMode() === 'grid'"
      (click)="viewMode.set('grid')"
      aria-label="Grid view"
    >
      <mat-icon>grid_view</mat-icon> Grid
    </button>
    <button
      mat-stroked-button
      class="view-toggle-btn"
      [class.active]="viewMode() === 'compact'"
      (click)="viewMode.set('compact')"
      aria-label="Compact list view"
    >
      <mat-icon>view_list</mat-icon> Compact
    </button>
  </div>

  <div
    class="cards-layout-container"
    [class.grid-layout]="viewMode() === 'grid'"
    [class.compact-layout]="viewMode() === 'compact'"
  >
    @for (badge of paginatedBadges; track badge.badge_name) {
      <app-card [cardData]="transformBadgeData(badge)" [viewMode]="viewMode()">
      </app-card>
    }
  </div>
</div>

<app-pagination
  [currentPage]="currentPage"
  [itemsPerPage]="itemsPerPage"
  [totalItems]="totalItems"
  (pageChange)="onPageChange($event)"
  (itemsPerPageChange)="onItemsPerPageChange($event)"
>
</app-pagination>
