<div class="main-content-container">
  <h1>Badges Earned</h1>

  <div
    class="flex-row align-center justify-center gap-4"
    style="margin-bottom: 20px"
  >
    <button
      mat-stroked-button
      class="view-toggle-btn"
      [class.active]="viewMode() === 'cards'"
      (click)="viewMode.set('cards')"
      aria-label="Cards view"
    >
      <mat-icon>view_agenda</mat-icon> Cards
    </button>
    <button
      mat-stroked-button
      class="view-toggle-btn"
      [class.active]="viewMode() === 'compact'"
      (click)="viewMode.set('compact')"
      aria-label="Compact view"
    >
      <mat-icon>view_list</mat-icon> Compact
    </button>
  </div>

  <div
    class="cards-layout-container"
    [class.cards-layout]="viewMode() === 'cards'"
    [class.compact-layout]="viewMode() === 'compact'"
  >
    @for (badge of paginatedBadges; track badge.badge_name) {
      <app-card [cardData]="transformBadgeData(badge)" [viewMode]="viewMode()">
      </app-card>
    } @empty {
      @if (hasLoadError()) {
        <app-empty-state
          icon="cloud_off"
          variant="error"
          message="We couldn't load your badges. You may be offline or the data service is temporarily unavailable."
          buttonText="Retry"
          (action)="retryLoad()"
        ></app-empty-state>
      } @else {
        <app-empty-state
          icon="military_tech"
          message="No badges earned yet. Check back after a few more check-ins."
        ></app-empty-state>
      }
    }
  </div>
</div>

@if (totalItems > 0) {
  <app-pagination
    [currentPage]="currentPage"
    [itemsPerPage]="itemsPerPage"
    [totalItems]="totalItems"
    (pageChange)="onPageChange($event)"
    (itemsPerPageChange)="onItemsPerPageChange($event)"
  >
  </app-pagination>
}
