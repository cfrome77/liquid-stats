<div class="main-content-container">
  <h1>Wishlist</h1>

  @if (wishlist.length > 0) {
    <div
      class="flex-row align-center justify-center gap-4"
      style="margin-bottom: 20px"
    >
      <button
        mat-stroked-button
        class="view-toggle-btn"
        [class.active]="viewMode() === 'grid'"
        (click)="viewMode.set('grid')"
        aria-label="Grid view"
      >
        <mat-icon>grid_view</mat-icon> Grid
      </button>
      <button
        mat-stroked-button
        class="view-toggle-btn"
        [class.active]="viewMode() === 'compact'"
        (click)="viewMode.set('compact')"
        aria-label="Compact list view"
      >
        <mat-icon>view_list</mat-icon> Compact
      </button>
    </div>

    <div class="flex-column" style="align-items: stretch; gap: 10px">
      @for (item of paginatedWishlist; track item.title) {
        <app-card [cardData]="item" [viewMode]="viewMode()"></app-card>
      }
    </div>

    @if (totalItems > itemsPerPage) {
      <app-pagination
        [totalItems]="totalItems"
        [itemsPerPage]="itemsPerPage"
        [currentPage]="currentPage"
        (pageChange)="goToPage($event)"
      >
      </app-pagination>
    }
  } @else {
    <app-empty-state
      icon="bookmark_border"
      message="Your wishlist is currently empty."
      buttonText="Explore Beers"
      (action)="navigateToCheckins()"
    ></app-empty-state>
  }
</div>
