<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 400"
  width="400"
  height="400"
  role="img"
  aria-label="No photo available"
>
  <defs>
    <linearGradient id="ls-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3440" />
      <stop offset="1" stop-color="#151b23" />
    </linearGradient>
    <linearGradient id="ls-beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffca28" />
      <stop offset="1" stop-color="#e65100" />
    </linearGradient>
    <clipPath id="ls-glass">
      <path d="M150 150 H250 L238 300 Q237 310 228 310 H172 Q163 310 162 300 Z" />
    </clipPath>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#ls-bg)" />

  <!-- Rising bubbles -->
  <g fill="#ffffff" opacity="0.22">
    <circle cx="186" cy="266" r="6" />
    <circle cx="214" cy="238" r="4" />
    <circle cx="199" cy="212" r="3" />
    <circle cx="224" cy="274" r="3.5" />
  </g>

  <!-- Beer + foam, clipped to the glass shape -->
  <g clip-path="url(#ls-glass)">
    <rect x="140" y="186" width="120" height="140" fill="url(#ls-beer)" />
    <rect x="140" y="176" width="120" height="16" fill="#fff8e7" />
  </g>

  <!-- Glass outline and rim -->
  <path
    d="M150 150 H250 L238 300 Q237 310 228 310 H172 Q163 310 162 300 Z"
    fill="none"
    stroke="#cbd5e1"
    stroke-width="8"
    stroke-linejoin="round"
    opacity="0.9"
  />
  <line
    x1="146"
    y1="150"
    x2="254"
    y2="150"
    stroke="#cbd5e1"
    stroke-width="8"
    stroke-linecap="round"
    opacity="0.9"
  />
</svg>
