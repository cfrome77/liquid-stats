<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Liquid Stats</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Liquid Stats - Track every pour you enjoy. View your beer history, checkins, and statistics."
    />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Liquid Stats" />
    <meta property="og:title" content="Liquid Stats" />
    <meta
      property="og:description"
      content="Track every pour you enjoy. Explore your beer history, checkins, top-rated drinks, badges, and statistics."
    />
    <meta property="og:image" content="/assets/images/LiquidStatsLogo.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Liquid Stats" />
    <meta
      name="twitter:description"
      content="Track every pour you enjoy. Explore your beer history, checkins, top-rated drinks, badges, and statistics."
    />
    <meta name="twitter:image" content="/assets/images/LiquidStatsLogo.webp" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="preload"
      as="image"
      href="/assets/images/LiquidStatsLogo.webp"
      imagesrcset="/assets/images/LiquidStatsLogo-400w.webp 400w, /assets/images/LiquidStatsLogo.webp 1280w"
      imagesizes="(max-width: 400px) 100vw, 420px"
      fetchpriority="high"
    />
    <link rel="preload" href="/assets/data/stats.json" as="fetch" crossorigin />

    <link
      rel="preconnect"
      href="https://www.googletagmanager.com"
      crossorigin
    />
    <link
      rel="preconnect"
      href="https://www.google-analytics.com"
      crossorigin
    />
    <link rel="preconnect" href="https://assets.untappd.com" crossorigin />
    <link rel="preconnect" href="https://images.untp.beer" crossorigin />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
